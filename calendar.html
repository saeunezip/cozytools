<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이벤트 캘린더 · 더 코지 플로리스트</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="코지 도구 모음" />
    <meta property="og:title" content="이벤트 캘린더" />
    <meta property="og:description" content="더 코지 플로리스트 · 게임 이벤트·업데이트 일정을 한눈에" />
    <meta property="og:url" content="https://cozytools.kro.kr/calendar.html" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="이벤트 캘린더" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 0;
        padding: 16px 10px 40px;
        background: #f7f7f8;
        color: #263238;
      }
      .container {
        max-width: 760px;
        margin: auto;
      }

      .header-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .title {
        color: #152c57;
        margin: 0;
        font-size: 21px;
      }
      .nav-btn {
        background: #1f3b73;
        color: #fff;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 9px;
        font-weight: bold;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }
      .nav-btn:hover {
        filter: brightness(0.92);
      }

      .panel {
        background: #fff;
        border-radius: 14px;
        padding: 14px 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-bottom: 14px;
      }
      .desc {
        font-size: 12.5px;
        color: #90a4ae;
        margin: 0 0 14px;
        line-height: 1.6;
      }
      .info-box {
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 10px;
        padding: 10px 13px;
        font-size: 12.5px;
        color: #6d5a1f;
        line-height: 1.6;
        margin-bottom: 14px;
      }

      /* 월 이동 */
      .month-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding: 0 4px;
      }
      .month-nav button {
        background: #eceff1;
        border: none;
        color: #1f3b73;
        font-weight: bold;
        font-size: 16px;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        cursor: pointer;
      }
      .month-nav button:hover {
        background: #dfe3e6;
      }
      .month-label {
        font-size: 16px;
        font-weight: bold;
        color: #152c57;
      }
      .today-btn {
        background: none;
        border: 1px solid #dfe3e6;
        color: #546e7a;
        font-size: 11.5px;
        font-weight: bold;
        padding: 5px 10px;
        border-radius: 20px;
        cursor: pointer;
        margin-left: 8px;
      }
      .today-btn:hover {
        background: #eceff1;
      }

      /* 요일 헤더 */
      .weekday-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        margin-bottom: 2px;
      }
      .weekday-row span {
        text-align: center;
        font-size: 11px;
        font-weight: bold;
        color: #90a4ae;
        padding: 2px 0 6px;
      }
      .weekday-row span:first-child {
        color: #e57373;
      }
      .weekday-row span:last-child {
        color: #64b5f6;
      }

      /* 달력 — 주 단위 스트립 */
      .week-strip {
        border-top: 1px solid #f0f1f3;
        padding-top: 3px;
      }
      .week-strip:first-child {
        border-top: none;
      }
      .daynum-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }
      .daynum-cell {
        display: flex;
        justify-content: center;
        padding: 2px 0;
      }
      .daynum-cell span {
        font-size: 11.5px;
        font-weight: bold;
        color: #546e7a;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 50%;
      }
      .daynum-cell.out span {
        color: #d3d8db;
        font-weight: normal;
      }
      .daynum-cell.sun span {
        color: #e57373;
      }
      .daynum-cell.sat span {
        color: #64b5f6;
      }
      .daynum-cell.today span {
        background: #1f3b73;
        color: #fff !important;
      }

      .bars-area {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-auto-rows: 17px;
        gap: 2px 2px;
        margin-top: 2px;
        margin-bottom: 4px;
      }
      .event-bar {
        color: #fff;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 6px;
        line-height: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-radius: 6px;
      }
      .event-bar.cont-left {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
        margin-left: -2px;
        padding-left: 4px;
      }
      .event-bar.cont-right {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
        margin-right: -2px;
      }

      /* 이벤트 목록 (모바일 등 막대 텍스트가 잘릴 때 참고용) */
      .event-list {
        margin-top: 4px;
      }
      .event-item {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #eceff1;
      }
      .event-item:last-child {
        border-bottom: none;
      }

      .event-dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-top: 5px;
      }
      .event-date {
        flex: none;
        width: 76px;
        font-size: 12px;
        color: #90a4ae;
        font-weight: bold;
        line-height: 1.5;
      }
      .event-body {
        flex: 1;
        min-width: 0;
      }
      .event-body .ename {
        font-size: 14px;
        font-weight: bold;
        color: #152c57;
      }
      .event-body .edesc {
        font-size: 12.5px;
        color: #78909c;
        margin-top: 2px;
        line-height: 1.5;
      }
      .empty-msg {
        text-align: center;
        color: #90a4ae;
        font-size: 13px;
        padding: 14px 0;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #b0bec5;
        margin-top: 24px;
        line-height: 1.8;
      }
      .footer-note a {
        color: #90a4ae;
      }

      @media (max-width: 420px) {
        .bars-area {
          grid-auto-rows: 15px;
        }
        .event-bar {
          font-size: 9px;
          padding: 1px 4px;
          line-height: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-area">
        <h2 class="title">이벤트 캘린더</h2>
        <a href="index.html" class="nav-btn">도구 모음</a>
      </div>

      <div class="info-box">
        게임 이벤트·업데이트 일정을 한눈에 모아봐요.
      </div>

      <div class="panel">
        <div class="month-nav">
          <button onclick="shiftMonth(-1)" aria-label="이전 달">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <div>
            <button
              class="today-btn"
              onclick="goToday()"
              style="display: inline-block; width: auto; height: auto"
            >
              오늘
            </button>
            <button onclick="shiftMonth(1)" aria-label="다음 달">›</button>
          </div>
        </div>

        <div class="weekday-row">
          <span>일</span><span>월</span><span>화</span><span>수</span
          ><span>목</span><span>금</span><span>토</span>
        </div>

        <div id="calGrid"></div>
      </div>

      <div class="panel">
        <div class="desc" style="margin-bottom: 8px">이번 달 일정</div>
        <div class="event-list" id="eventList"></div>
      </div>

      <p class="footer-note">
        더 코지 플로리스트 길드 &lt;백야&gt; 제작 ·
        <a href="index.html">다른 도구 보기</a>
      </p>
    </div>

    <script>
      /* ==========================================================
         이벤트 데이터는 cozytools-backend(Apps Script + 구글시트)에서
         불러옵니다. 등록/수정은 register.html에서 합니다.

         내부 표현(fetch 후 normalizeEvent로 변환):
         단일/기간 일정:
           { title, start, end, desc }
         매주 반복 일정 (예: 매주 금~월):
           { title, repeat: 'weekly', weekdayStart, weekdayEnd (0~6, 일~토), desc }
           weekdayEnd < weekdayStart 면 주를 넘겨서 이어지는 것으로 취급 (금~월 등)
         ========================================================== */
      const API_URL = "https://cozytools-backend.saeunezip.workers.dev";

      let EVENTS = [];

      function normalizeEvent(raw) {
        if (raw.type === "weekly") {
          return {
            id: raw.id,
            title: raw.title,
            repeat: "weekly",
            weekdayStart: Number(raw.weekdayStart),
            weekdayEnd: Number(raw.weekdayEnd),
            desc: raw.desc,
          };
        }
        return {
          id: raw.id,
          title: raw.title,
          start: String(raw.start).slice(0, 10),
          end: String(raw.end).slice(0, 10),
          desc: raw.desc,
        };
      }

      async function loadEvents() {
        // 서버 응답이 느릴 수 있어서, 데이터 없이 달력 틀부터 바로 보여주고 나서 채워 넣음
        render();
        document.getElementById("eventList").innerHTML =
          '<div class="empty-msg">일정을 불러오는 중...</div>';

        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "불러오기 실패");
          EVENTS = (data.events || []).map(normalizeEvent);
          assignColors(EVENTS);
          render();
        } catch (err) {
          document.getElementById("eventList").innerHTML =
            '<div class="empty-msg">일정을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>';
        }
      }

      const PALETTE = [
        "#6C63C7",
        "#E0757A",
        "#3FA796",
        "#E3A23C",
        "#4A90D9",
        "#B45FC0",
        "#D9698B",
        "#5FAF6B",
        "#C77B3F",
        "#4FA8C9",
        "#9C6ADE",
        "#7A9C3F",
      ];

      // 같은 이벤트는 항상 같은 색, 화면에 같이 뜨는 이벤트끼리는 색이 안 겹치게
      // (해시 대신 등장 순서대로 팔레트를 순서대로 배정)
      let COLOR_MAP = {};
      function assignColors(events) {
        COLOR_MAP = {};
        let i = 0;
        events.forEach(function (ev) {
          if (!(ev.id in COLOR_MAP)) {
            COLOR_MAP[ev.id] = PALETTE[i % PALETTE.length];
            i++;
          }
        });
      }
      function colorFor(id) {
        return COLOR_MAP[id] || PALETTE[0];
      }

      function toDateOnly(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }
      function parseYMD(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function fmtYMD(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function addDays(d, n) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
      }
      function diffDays(a, b) {
        return Math.round((a - b) / 86400000);
      }

      const today = toDateOnly(new Date());
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth(); // 0-based

      function shiftMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear--;
        } else if (viewMonth > 11) {
          viewMonth = 0;
          viewYear++;
        }
        render();
      }

      function goToday() {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        render();
      }

      /* 이번 달 그리드에 필요한 날짜 칸(앞뒤 달 패딩 포함, 7의 배수) */
      function buildGridCells(year, month) {
        const firstDay = new Date(year, month, 1);
        const startWeekday = firstDay.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cells = [];
        for (let i = startWeekday; i > 0; i--) {
          cells.push({ date: addDays(firstDay, -i), inMonth: false });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ date: new Date(year, month, d), inMonth: true });
        }
        while (cells.length % 7 !== 0) {
          const last = cells[cells.length - 1].date;
          cells.push({ date: addDays(last, 1), inMonth: false });
        }
        return cells;
      }

      /* 주어진 기간과 겹치는 occurrence 목록 생성.
         매주 반복 일정은 캘린더/이번달 일정에는 안 띄우고 "진행중인 이벤트"에서만 보여주기로
         했으므로 여기서는 단일/기간 일정만 다룸 (renderOngoing 참고). */
      function getOccurrences(rangeStart, rangeEnd) {
        const occ = [];
        EVENTS.forEach(function (ev) {
          if (ev.repeat === "weekly") return;
          const s = parseYMD(ev.start),
            e = parseYMD(ev.end);
          if (e >= rangeStart && s <= rangeEnd) {
            occ.push({
              title: ev.title,
              start: s,
              end: e,
              desc: ev.desc,
              color: colorFor(ev.id),
            });
          }
        });
        return occ;
      }

      /* 전체 표시 기간 기준으로 레인(줄) 배정 — 같은 이벤트는 주가 바뀌어도 같은 줄 유지 */
      function assignLanes(occurrences) {
        const sorted = occurrences.slice().sort(function (a, b) {
          return a.start - b.start || b.end - b.start - (a.end - a.start);
        });
        const laneEndDates = [];
        sorted.forEach(function (o) {
          let lane = laneEndDates.findIndex(function (endDate) {
            return endDate < o.start;
          });
          if (lane === -1) {
            lane = laneEndDates.length;
            laneEndDates.push(o.end);
          } else {
            laneEndDates[lane] = o.end;
          }
          o.lane = lane;
        });
        return sorted;
      }

      function render() {
        document.getElementById("monthLabel").textContent =
          viewYear + "년 " + (viewMonth + 1) + "월";

        const cells = buildGridCells(viewYear, viewMonth);
        const rangeStart = cells[0].date;
        const rangeEnd = cells[cells.length - 1].date;
        const occurrences = assignLanes(getOccurrences(rangeStart, rangeEnd));

        const grid = document.getElementById("calGrid");
        grid.innerHTML = "";

        for (let w = 0; w < cells.length; w += 7) {
          const week = cells.slice(w, w + 7);
          const weekStart = week[0].date;
          const weekEnd = week[6].date;

          const strip = document.createElement("div");
          strip.className = "week-strip";

          const daynumRow = document.createElement("div");
          daynumRow.className = "daynum-row";
          week.forEach(function (cell, i) {
            const isToday = cell.date.getTime() === today.getTime();
            const cls = ["daynum-cell"];
            if (!cell.inMonth) cls.push("out");
            if (i === 0) cls.push("sun");
            if (i === 6) cls.push("sat");
            if (isToday) cls.push("today");
            const div = document.createElement("div");
            div.className = cls.join(" ");
            div.innerHTML = "<span>" + cell.date.getDate() + "</span>";
            daynumRow.appendChild(div);
          });
          strip.appendChild(daynumRow);

          const weekOcc = occurrences.filter(function (o) {
            return o.end >= weekStart && o.start <= weekEnd;
          });

          if (weekOcc.length) {
            const barsArea = document.createElement("div");
            barsArea.className = "bars-area";
            weekOcc.forEach(function (o) {
              const startCol = Math.max(0, diffDays(o.start, weekStart));
              const endCol = Math.min(6, diffDays(o.end, weekStart));
              const bar = document.createElement("div");
              const clsList = ["event-bar"];
              if (o.start < weekStart) clsList.push("cont-left");
              if (o.end > weekEnd) clsList.push("cont-right");
              bar.className = clsList.join(" ");
              bar.style.gridColumn = (startCol + 1) + " / " + (endCol + 2);
              bar.style.gridRow = String(o.lane + 1);
              bar.style.background = o.color;
              bar.textContent = o.title;
              bar.title = o.title + (o.desc ? " — " + o.desc : "");
              barsArea.appendChild(bar);
            });
            strip.appendChild(barsArea);
          }

          grid.appendChild(strip);
        }

        // 이번 달과 겹치는 일정 목록 (막대 텍스트가 잘릴 때 참고용)
        const monthStart = new Date(viewYear, viewMonth, 1);
        const monthEnd = new Date(viewYear, viewMonth + 1, 0);
        const monthOcc = occurrences
          .filter(function (o) {
            return o.end >= monthStart && o.start <= monthEnd;
          })
          .sort(function (a, b) {
            return a.start - b.start;
          });

        const listBox = document.getElementById("eventList");
        if (!monthOcc.length) {
          listBox.innerHTML =
            '<div class="empty-msg">이번 달 등록된 일정이 없습니다.</div>';
          return;
        }

        listBox.innerHTML = monthOcc
          .map(function (o) {
            const s = fmtYMD(o.start),
              e = fmtYMD(o.end);
            const dateLabel =
              s === e
                ? s.slice(5).replace("-", ".")
                : s.slice(5).replace("-", ".") + " ~ " + e.slice(5).replace("-", ".");
            return (
              '<div class="event-item">' +
              '<span class="event-dot" style="background:' +
              o.color +
              '"></span>' +
              '<div class="event-date">' +
              dateLabel +
              "</div>" +
              '<div class="event-body"><div class="ename">' +
              o.title +
              '</div><div class="edesc">' +
              (o.desc || "") +
              "</div></div>" +
              "</div>"
            );
          })
          .join("");
      }

      loadEvents();
    </script>
  </body>
</html>
