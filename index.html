<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cozytools</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cozytools" />
    <meta property="og:title" content="Cozytools" />
    <meta property="og:description" content="더 코지 플로리스트 플레이를 돕는 도구 모음. 길드 <백야> 제작" />
    <meta property="og:url" content="https://cozytools.kro.kr/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cozytools" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 0;
        padding: 28px 10px 40px;
        background: #f7f7f8;
        color: #263238;
      }
      .container {
        max-width: 640px;
        margin: auto;
      }

      .hero {
        text-align: center;
        margin-bottom: 24px;
      }
      .hero h1 {
        color: #152c57;
        margin: 0 0 8px;
        font-size: 26px;
      }
      .hero p {
        color: #90a4ae;
        font-size: 13.5px;
        line-height: 1.7;
        margin: 0;
      }

      .panel {
        background: #fff;
        border-radius: 14px;
        padding: 14px 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-bottom: 20px;
      }
      .panel-link {
        display: block;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
      }
      .panel-link:active {
        filter: brightness(0.97);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .panel-head .desc {
        font-size: 12.5px;
        color: #90a4ae;
        margin: 0;
      }
      .panel-head .arrow {
        color: #cfd8dc;
        font-size: 16px;
      }

      /* 진행중인 이벤트 (한 줄에 2~3개, 압축 카드) */
      .ongoing-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      @media (min-width: 480px) {
        .ongoing-list {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .ongoing-btn {
        padding: 8px 10px;
        border: 1.5px solid #eceff1;
        border-radius: 10px;
        background: #fbfbfc;
        min-width: 0;
      }
      .ongoing-top {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 2px;
      }
      .ongoing-dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .ongoing-cat {
        font-size: 10px;
        font-weight: bold;
        color: #90a4ae;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ongoing-name {
        font-size: 12.5px;
        font-weight: bold;
        color: #152c57;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-bottom: 2px;
      }
      .ongoing-period {
        font-size: 10.5px;
        color: #90a4ae;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ongoing-warn {
        color: #d32f2f;
      }
      .empty-msg {
        text-align: center;
        color: #90a4ae;
        font-size: 13px;
        padding: 14px 0;
        grid-column: 1 / -1;
      }

      .card-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        text-decoration: none;
        color: inherit;
      }
      .card:active {
        filter: brightness(0.97);
      }
      .card .icon {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: #f3f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .card .body {
        flex: 1;
        min-width: 0;
      }
      .card .cname {
        font-size: 15.5px;
        font-weight: bold;
        color: #152c57;
      }
      .card .cdesc {
        font-size: 12.5px;
        color: #90a4ae;
        margin-top: 3px;
        line-height: 1.6;
      }
      .card .arrow {
        flex: none;
        color: #cfd8dc;
        font-size: 18px;
      }
      .card.soon {
        opacity: 0.6;
      }
      .badge-soon {
        display: inline-block;
        font-size: 10px;
        font-weight: bold;
        color: #fff;
        background: #b0bec5;
        padding: 2px 7px;
        border-radius: 10px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #b0bec5;
        margin-top: 30px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <h1>Cozytools</h1>
        <p>더 코지 플로리스트 플레이를 돕는 도구 모음</p>
      </div>

      <a class="panel panel-link" href="calendar.html">
        <div class="panel-head">
          <p class="desc">진행중인 이벤트</p>
          <span class="arrow">›</span>
        </div>
        <div class="ongoing-list" id="ongoingList">
          <div class="empty-msg">불러오는 중...</div>
        </div>
      </a>

      <div class="card-list">
        <a class="card" href="calc.html">
          <div class="icon">🧮</div>
          <div class="body">
            <div class="cname">임무 횟수 계산기</div>
            <div class="cdesc">
              길드전 목표 점수까지 몇 번, 어떤 등급으로 채우면 되는지 계산해요
            </div>
          </div>
          <div class="arrow">›</div>
        </a>

        <div class="card soon">
          <div class="icon">🏪</div>
          <div class="body">
            <div class="cname">스타소울 상점 계산기<span class="badge-soon">예정</span></div>
            <div class="cdesc">준비 중인 도구예요</div>
          </div>
        </div>

        <div class="card soon">
          <div class="icon">🚀</div>
          <div class="body">
            <div class="cname">스타소울 파견 계산기<span class="badge-soon">예정</span></div>
            <div class="cdesc">준비 중인 도구예요</div>
          </div>
        </div>
      </div>

      <p class="footer-note">
        위 사이트는 &lt;백야&gt;길드에서 제작했습니다. 많관부 - ID:50016
      </p>
    </div>

    <script>
      const API_URL = "https://cozytools-backend.saeunezip.workers.dev";

      const PALETTE = [
        "#6C63C7",
        "#E0757A",
        "#3FA796",
        "#E3A23C",
        "#4A90D9",
        "#B45FC0",
        "#D9698B",
        "#5FAF6B",
        "#C77B3F",
        "#4FA8C9",
        "#9C6ADE",
        "#7A9C3F",
      ];
      const WEEKDAY_LABEL = ["일", "월", "화", "수", "목", "금", "토"];
      let COLOR_MAP = {};
      function assignColors(events) {
        COLOR_MAP = {};
        let i = 0;
        events.forEach(function (ev) {
          if (!(ev.id in COLOR_MAP)) {
            COLOR_MAP[ev.id] = PALETTE[i % PALETTE.length];
            i++;
          }
        });
      }
      function colorFor(id) {
        return COLOR_MAP[id] || PALETTE[0];
      }

      function toDateOnly(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }
      function parseYMD(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function fmtYMD(d) {
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      }
      function addDays(d, n) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
      }
      function diffDays(a, b) {
        return Math.round((a - b) / 86400000);
      }
      const today = toDateOnly(new Date());

      function extractCategory(title) {
        const idx = title.indexOf(" - ");
        return idx === -1 ? { category: null, name: title } : { category: title.slice(0, idx), name: title.slice(idx + 3) };
      }

      function expiryWarning(endDate) {
        const daysLeft = diffDays(endDate, today);
        if (daysLeft === 0) {
          const endOfToday = addDays(today, 1);
          const hoursLeft = Math.max(1, Math.ceil((endOfToday - new Date()) / 3600000));
          return hoursLeft + "시간 남음";
        }
        if (daysLeft === 1) return "1일 남음";
        return null;
      }

      function normalizeEvent(raw) {
        if (raw.type === "weekly") {
          return {
            id: raw.id,
            title: raw.title,
            repeat: "weekly",
            weekdayStart: Number(raw.weekdayStart),
            weekdayEnd: Number(raw.weekdayEnd),
            desc: raw.desc,
          };
        }
        return {
          id: raw.id,
          title: raw.title,
          start: String(raw.start).slice(0, 10),
          end: String(raw.end).slice(0, 10),
          desc: raw.desc,
        };
      }

      function renderOngoing(events) {
        const items = [];
        events.forEach(function (ev) {
          const parts = extractCategory(ev.title);
          if (ev.repeat === "weekly") {
            const period =
              ev.weekdayStart === ev.weekdayEnd
                ? "매주 " + WEEKDAY_LABEL[ev.weekdayStart] + "요일"
                : "매주 " + WEEKDAY_LABEL[ev.weekdayStart] + "~" + WEEKDAY_LABEL[ev.weekdayEnd] + "요일";
            items.push({ id: ev.id, category: parts.category, name: parts.name, period: period, warn: null, color: colorFor(ev.id) });
          } else {
            const s = parseYMD(ev.start),
              e = parseYMD(ev.end);
            if (today >= s && today <= e) {
              const period = fmtYMD(s).slice(5).replace("-", ".") + " ~ " + fmtYMD(e).slice(5).replace("-", ".");
              items.push({
                id: ev.id,
                category: parts.category,
                name: parts.name,
                period: period,
                warn: expiryWarning(e),
                color: colorFor(ev.id),
              });
            }
          }
        });

        const box = document.getElementById("ongoingList");
        if (!items.length) {
          box.innerHTML = '<div class="empty-msg">진행중인 이벤트가 없습니다.</div>';
          return;
        }
        box.innerHTML = items
          .map(function (it) {
            return (
              '<div class="ongoing-btn">' +
              '<div class="ongoing-top">' +
              '<span class="ongoing-dot" style="background:' +
              it.color +
              '"></span>' +
              (it.category ? '<span class="ongoing-cat">' + it.category + "</span>" : "") +
              "</div>" +
              '<div class="ongoing-name">' +
              it.name +
              "</div>" +
              '<div class="ongoing-period">' +
              it.period +
              (it.warn ? ' · <span class="ongoing-warn">' + it.warn + "</span>" : "") +
              "</div>" +
              "</div>"
            );
          })
          .join("");
      }

      async function loadOngoing() {
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "불러오기 실패");
          const events = (data.events || []).map(normalizeEvent);
          assignColors(events);
          renderOngoing(events);
        } catch (err) {
          document.getElementById("ongoingList").innerHTML =
            '<div class="empty-msg">일정을 불러오지 못했어요.</div>';
        }
      }

      loadOngoing();
    </script>
  </body>
</html>
