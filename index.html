<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>코지 도구 모음</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="코지 도구 모음" />
    <meta property="og:title" content="코지 도구 모음" />
    <meta property="og:description" content="더 코지 플로리스트 유저를 위한 계산기·도구 모음. 길드 <백야> 제작" />
    <meta property="og:url" content="https://cozytools.kro.kr/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="코지 도구 모음" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 0;
        padding: 28px 10px 40px;
        background: #f7f7f8;
        color: #263238;
      }
      .container {
        max-width: 640px;
        margin: auto;
      }

      .hero {
        text-align: center;
        margin-bottom: 24px;
      }
      .hero h1 {
        color: #152c57;
        margin: 0 0 8px;
        font-size: 24px;
      }
      .hero p {
        color: #90a4ae;
        font-size: 13.5px;
        line-height: 1.7;
        margin: 0;
      }

      .card-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        text-decoration: none;
        color: inherit;
      }
      .card:active {
        filter: brightness(0.97);
      }
      .card .icon {
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: #f3f6fc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .card .body {
        flex: 1;
        min-width: 0;
      }
      .card .cname {
        font-size: 15.5px;
        font-weight: bold;
        color: #152c57;
      }
      .card .cdesc {
        font-size: 12.5px;
        color: #90a4ae;
        margin-top: 3px;
        line-height: 1.6;
      }
      .card .arrow {
        flex: none;
        color: #cfd8dc;
        font-size: 18px;
      }
      .card.soon {
        opacity: 0.6;
      }
      .badge-soon {
        display: inline-block;
        font-size: 10px;
        font-weight: bold;
        color: #fff;
        background: #b0bec5;
        padding: 2px 7px;
        border-radius: 10px;
        margin-left: 6px;
        vertical-align: middle;
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: #b0bec5;
        margin-top: 30px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <h1>코지 도구 모음</h1>
        <p>
          더 코지 플로리스트 유저를 위한 계산기·도구 모음이에요.<br />
          내 데이터 없이 숫자만 넣으면 바로 써볼 수 있어요.<br />
          길드 &lt;백야&gt;에서 만들었어요.
        </p>
      </div>

      <div class="card-list">
        <a class="card" href="calc.html">
          <div class="icon">🧮</div>
          <div class="body">
            <div class="cname">임무 횟수 계산기</div>
            <div class="cdesc">
              길드전 목표 점수까지 몇 번, 어떤 등급으로 채우면 되는지 계산해요
            </div>
          </div>
          <div class="arrow">›</div>
        </a>

        <a class="card soon" href="calendar.html">
          <div class="icon">📅</div>
          <div class="body">
            <div class="cname">이벤트 캘린더<span class="badge-soon">준비중</span></div>
            <div class="cdesc">게임 이벤트·업데이트 일정을 한눈에 모아봐요</div>
          </div>
          <div class="arrow">›</div>
        </a>
      </div>

      <p class="footer-note">
        길드 시트 제작 문의는 &lt;백야&gt; 길드에게 편하게 말씀해 주세요.
      </p>
    </div>
  </body>
</html>
