<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>일정 등록 · 코지 도구 모음</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 0;
        padding: 16px 10px 40px;
        background: #f7f7f8;
        color: #263238;
      }
      .container {
        max-width: 640px;
        margin: auto;
      }

      .header-area {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .title {
        color: #152c57;
        margin: 0;
        font-size: 21px;
      }
      .nav-btn {
        background: #1f3b73;
        color: #fff;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 9px;
        font-weight: bold;
        font-size: 14px;
        border: none;
        cursor: pointer;
      }

      .panel {
        background: #fff;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-bottom: 14px;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-size: 15.5px;
        color: #152c57;
      }
      .desc {
        font-size: 12.5px;
        color: #90a4ae;
        margin: 0 0 14px;
        line-height: 1.6;
      }

      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        color: #546e7a;
        margin-bottom: 5px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #dfe3e6;
        border-radius: 9px;
        font-size: 15px;
        outline: none;
        font-family: inherit;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #1f3b73;
      }
      .field textarea {
        resize: vertical;
        min-height: 60px;
      }
      .field-row {
        display: flex;
        gap: 10px;
      }
      .field-row .field {
        flex: 1;
      }

      .type-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .type-toggle button {
        flex: 1;
        padding: 10px;
        border-radius: 9px;
        border: 2px solid #eceff1;
        background: #fbfbfc;
        color: #546e7a;
        font-weight: bold;
        font-size: 13.5px;
        cursor: pointer;
      }
      .type-toggle button.on {
        border-color: #1f3b73;
        background: #f3f6fc;
        color: #1f3b73;
      }

      .btn {
        background: #1f3b73;
        color: #fff;
        border: none;
        padding: 11px 18px;
        border-radius: 9px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        width: 100%;
      }
      .btn:hover {
        filter: brightness(0.94);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .btn-danger {
        background: #e0757a;
      }
      .btn-ghost {
        background: none;
        border: 1px solid #dfe3e6;
        color: #78909c;
        font-weight: bold;
        font-size: 12.5px;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .msg {
        font-size: 13px;
        font-weight: bold;
        padding: 10px 13px;
        border-radius: 10px;
        margin-top: 10px;
      }
      .msg.ok {
        background: #e6f4ea;
        color: #1e7d34;
      }
      .msg.err {
        background: #ffebee;
        color: #b71c1c;
      }

      .gate {
        text-align: center;
        padding: 30px 10px;
      }
      .gate input {
        max-width: 220px;
        margin: 14px auto;
        display: block;
        text-align: center;
        font-size: 18px;
        letter-spacing: 2px;
      }

      .event-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #eceff1;
      }
      .event-row:last-child {
        border-bottom: none;
      }
      .event-row .body {
        flex: 1;
        min-width: 0;
      }
      .event-row .ename {
        font-size: 14px;
        font-weight: bold;
        color: #152c57;
      }
      .event-row .emeta {
        font-size: 12px;
        color: #90a4ae;
        margin-top: 2px;
      }
      .event-row .edesc {
        font-size: 12.5px;
        color: #78909c;
        margin-top: 2px;
      }
      .empty-msg {
        text-align: center;
        color: #90a4ae;
        font-size: 13px;
        padding: 14px 0;
      }

      .hidden {
        display: none !important;
      }

      /* 스타소울 — 시즌 등록 */
      .soul-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .soul-row .badge-grade {
        flex: none;
        width: 40px;
        text-align: center;
        font-size: 11.5px;
        font-weight: bold;
        color: #fff;
        border-radius: 8px;
        padding: 8px 0;
      }
      .badge-grade.SSR {
        background: #e3a23c;
      }
      .badge-grade.SR {
        background: #4a90d9;
      }
      .badge-grade.R {
        background: #90a4ae;
      }
      .soul-row input.sr-name {
        flex: 1.3;
        min-width: 0;
        padding: 9px 10px;
        border: 1px solid #dfe3e6;
        border-radius: 8px;
        font-size: 13.5px;
      }
      .soul-row input.sr-dorazy {
        flex: 1;
        min-width: 0;
        padding: 9px 10px;
        border: 1px solid #dfe3e6;
        border-radius: 8px;
        font-size: 12.5px;
      }

      /* 스타소울 — 보너스 체크리스트 (calc.html의 grade-item과 같은 톤) */
      .grade-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .grade-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border: 2px solid #eceff1;
        border-radius: 10px;
        cursor: pointer;
        user-select: none;
      }
      .grade-item.on {
        border-color: #1f3b73;
        background: #f3f6fc;
      }
      .grade-item input {
        width: 17px;
        height: 17px;
        accent-color: #1f3b73;
      }
      .grade-item .gname {
        font-weight: bold;
        font-size: 14px;
        flex: 1;
      }
      .grade-item .gprob {
        font-size: 12px;
        color: #90a4ae;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header-area">
        <h2 class="title">일정 등록</h2>
        <a href="index.html" class="nav-btn">도구 모음</a>
      </div>

      <!-- 비밀번호 게이트 -->
      <div class="panel gate" id="gatePanel">
        <div class="desc" style="margin-bottom: 0">관리자 비밀번호를 입력해 주세요.</div>
        <input type="password" id="pwInput" inputmode="numeric" placeholder="비밀번호" />
        <button class="btn" style="max-width: 220px; margin: 0 auto" onclick="unlock()">확인</button>
        <div id="gateMsg"></div>
      </div>

      <!-- 등록/관리 화면 -->
      <div id="mainArea" class="hidden">
        <div class="panel">
          <h3>새 일정 등록</h3>

          <div class="type-toggle">
            <button id="typeBtnSingle" class="on" onclick="setType('single')">단일/기간 일정</button>
            <button id="typeBtnWeekly" onclick="setType('weekly')">매주 반복 일정</button>
          </div>

          <div class="field">
            <label>카테고리 (선택)</label>
            <select id="fCategory" onchange="onCategoryChange()">
              <option value="">카테고리 없음</option>
              <option value="__custom__">+ 새 카테고리 입력</option>
            </select>
          </div>
          <div class="field hidden" id="categoryCustomField">
            <label>새 카테고리 이름</label>
            <input type="text" id="fCategoryCustom" placeholder="예: 천심동등" />
          </div>

          <div class="field">
            <label>이름</label>
            <input type="text" id="fTitle" placeholder="예: 길드전 (카테고리 고르면 그 뒤에 붙는 이름)" />
          </div>

          <!-- 단일/기간 일정 필드 -->
          <div id="singleFields">
            <div class="field-row">
              <div class="field">
                <label>시작일</label>
                <input type="date" id="fStart" />
              </div>
              <div class="field">
                <label>종료일</label>
                <input type="date" id="fEnd" />
              </div>
            </div>
          </div>

          <!-- 매주 반복 필드 -->
          <div id="weeklyFields" class="hidden">
            <div class="desc" style="margin-bottom: 8px">
              매주 이 요일부터 저 요일까지 반복돼요 (하루짜리면 시작·종료를 같은 요일로 선택).
            </div>
            <div class="field-row">
              <div class="field">
                <label>시작 요일</label>
                <select id="fWeekdayStart">
                  <option value="0">일요일</option>
                  <option value="1" selected>월요일</option>
                  <option value="2">화요일</option>
                  <option value="3">수요일</option>
                  <option value="4">목요일</option>
                  <option value="5">금요일</option>
                  <option value="6">토요일</option>
                </select>
              </div>
              <div class="field">
                <label>종료 요일</label>
                <select id="fWeekdayEnd">
                  <option value="0">일요일</option>
                  <option value="1" selected>월요일</option>
                  <option value="2">화요일</option>
                  <option value="3">수요일</option>
                  <option value="4">목요일</option>
                  <option value="5">금요일</option>
                  <option value="6">토요일</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label>설명 (선택)</label>
            <textarea id="fDesc" placeholder="상세 내용"></textarea>
          </div>

          <button class="btn" id="submitBtn" onclick="submitEvent()">등록</button>
          <div id="submitMsg"></div>
        </div>

        <div class="panel">
          <h3>등록된 일정 (<span id="countLabel">0</span>개)</h3>
          <div id="eventList"></div>
        </div>

        <div class="panel">
          <h3>스타소울 — 새 시즌 등록</h3>
          <p class="desc">
            시즌 시작일(일요일)과 그 시즌의 짝꿍 꽃 12종(SSR 2 / SR 5 / R 5)을 등록해요.
            dorazy.art ID는 몰라도 비워두면 등급 배지로 대신 표시돼요.
          </p>
          <div class="field">
            <label>시즌 시작일 (일요일)</label>
            <input type="date" id="ssStart" />
          </div>
          <div id="ssSoulRows"></div>
          <button class="btn" id="ssSubmitBtn" onclick="submitSeason()">시즌 등록</button>
          <div id="ssMsg"></div>
        </div>

        <div class="panel">
          <h3>스타소울 — 주간 보너스 선택</h3>
          <p class="desc">등록된 시즌 중 하나를 골라 그 주차의 보너스 소울 3종을 체크해요.</p>
          <div class="field-row">
            <div class="field">
              <label>시즌</label>
              <select id="sbSeason" onchange="onSeasonChange()"></select>
            </div>
            <div class="field">
              <label>주차</label>
              <select id="sbWeek" onchange="renderBonusChecklist()">
                <option value="1">1주차</option>
                <option value="2">2주차</option>
                <option value="3">3주차</option>
                <option value="4">4주차</option>
              </select>
            </div>
          </div>
          <div id="sbChecklist" class="grade-list"></div>
          <button class="btn" onclick="submitBonus()">보너스 저장</button>
          <div id="sbMsg"></div>
          <div class="desc" style="margin-top: 14px; margin-bottom: 6px">이미 저장된 주차별 보너스</div>
          <div id="sbSavedList"></div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "https://cozytools-backend.saeunezip.workers.dev";

      let pw = "";
      let curType = "single";
      let ALL_EVENTS = [];
      const WEEKDAY_LABEL = ["일", "월", "화", "수", "목", "금", "토"];

      function extractCategory(title) {
        const idx = title.indexOf(" - ");
        return idx === -1 ? null : title.slice(0, idx);
      }

      function populateCategories() {
        const cats = new Set();
        ALL_EVENTS.forEach(function (ev) {
          const c = extractCategory(ev.title);
          if (c) cats.add(c);
        });
        const sorted = Array.from(cats).sort();
        const sel = document.getElementById("fCategory");
        const prev = sel.value;
        sel.innerHTML =
          '<option value="">카테고리 없음</option>' +
          sorted
            .map(function (c) {
              return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>";
            })
            .join("") +
          '<option value="__custom__">+ 새 카테고리 입력</option>';
        if (Array.from(sel.options).some(function (o) { return o.value === prev; })) {
          sel.value = prev;
        }
      }

      function onCategoryChange() {
        const isCustom = document.getElementById("fCategory").value === "__custom__";
        document.getElementById("categoryCustomField").classList.toggle("hidden", !isCustom);
      }

      function unlock() {
        const val = document.getElementById("pwInput").value;
        if (!val) return;
        pw = val;
        document.getElementById("gatePanel").classList.add("hidden");
        document.getElementById("mainArea").classList.remove("hidden");
        loadEvents();
        loadSeasons();
      }

      function setType(type) {
        curType = type;
        document.getElementById("typeBtnSingle").classList.toggle("on", type === "single");
        document.getElementById("typeBtnWeekly").classList.toggle("on", type === "weekly");
        document.getElementById("singleFields").classList.toggle("hidden", type !== "single");
        document.getElementById("weeklyFields").classList.toggle("hidden", type !== "weekly");
      }

      function showMsg(elId, text, ok) {
        const el = document.getElementById(elId);
        el.innerHTML = '<div class="msg ' + (ok ? "ok" : "err") + '">' + text + "</div>";
      }

      async function submitEvent() {
        const name = document.getElementById("fTitle").value.trim();
        if (!name) {
          showMsg("submitMsg", "이름을 입력해 주세요.", false);
          return;
        }
        const catSel = document.getElementById("fCategory").value;
        const category =
          catSel === "__custom__" ? document.getElementById("fCategoryCustom").value.trim() : catSel;
        const title = category ? category + " - " + name : name;

        const body = { action: "add", pw: pw, title: title, type: curType, desc: document.getElementById("fDesc").value.trim() };

        if (curType === "single") {
          const start = document.getElementById("fStart").value;
          const end = document.getElementById("fEnd").value;
          if (!start || !end) {
            showMsg("submitMsg", "시작일/종료일을 입력해 주세요.", false);
            return;
          }
          body.start = start;
          body.end = end < start ? start : end;
        } else {
          body.weekdayStart = document.getElementById("fWeekdayStart").value;
          body.weekdayEnd = document.getElementById("fWeekdayEnd").value;
        }

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "등록 중...";

        try {
          const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(body) });
          const data = await res.json();
          if (data.ok) {
            showMsg("submitMsg", "등록했습니다.", true);
            document.getElementById("fTitle").value = "";
            document.getElementById("fDesc").value = "";
            document.getElementById("fStart").value = "";
            document.getElementById("fEnd").value = "";
            document.getElementById("fCategory").value = "";
            document.getElementById("fCategoryCustom").value = "";
            onCategoryChange();
            loadEvents();
          } else {
            showMsg("submitMsg", data.error || "등록에 실패했습니다.", false);
          }
        } catch (err) {
          showMsg("submitMsg", "서버에 연결하지 못했습니다: " + err.message, false);
        } finally {
          btn.disabled = false;
          btn.textContent = "등록";
        }
      }

      async function loadEvents() {
        const box = document.getElementById("eventList");
        box.innerHTML = '<div class="empty-msg">불러오는 중...</div>';
        try {
          const res = await fetch(API_URL);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "목록을 불러오지 못했습니다.");
          ALL_EVENTS = data.events || [];
          renderEvents(ALL_EVENTS);
          populateCategories();
        } catch (err) {
          box.innerHTML = '<div class="msg err">불러오기 실패: ' + err.message + "</div>";
        }
      }

      function renderEvents(events) {
        document.getElementById("countLabel").textContent = events.length;
        const box = document.getElementById("eventList");
        if (!events.length) {
          box.innerHTML = '<div class="empty-msg">등록된 일정이 없습니다.</div>';
          return;
        }

        events
          .sort(function (a, b) {
            return new Date(b.createdAt) - new Date(a.createdAt);
          });

        box.innerHTML = events
          .map(function (ev) {
            let meta;
            if (ev.type === "weekly") {
              const ws = Number(ev.weekdayStart),
                we = Number(ev.weekdayEnd);
              meta =
                ws === we
                  ? "매주 " + WEEKDAY_LABEL[ws] + "요일"
                  : "매주 " + WEEKDAY_LABEL[ws] + "~" + WEEKDAY_LABEL[we] + "요일";
            } else {
              meta = String(ev.start).slice(0, 10) + " ~ " + String(ev.end).slice(0, 10);
            }
            return (
              '<div class="event-row">' +
              '<div class="body">' +
              '<div class="ename">' +
              escapeHtml(ev.title) +
              "</div>" +
              '<div class="emeta">' +
              meta +
              "</div>" +
              (ev.desc ? '<div class="edesc">' + escapeHtml(ev.desc) + "</div>" : "") +
              "</div>" +
              '<button class="btn-ghost" onclick="removeEvent(\'' +
              ev.id +
              "')\">삭제</button>" +
              "</div>"
            );
          })
          .join("");
      }

      function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      async function removeEvent(id) {
        if (!confirm("이 일정을 삭제할까요?")) return;
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", pw: pw, id: id }),
          });
          const data = await res.json();
          if (!data.ok) {
            alert(data.error || "삭제에 실패했습니다.");
            return;
          }
          loadEvents();
        } catch (err) {
          alert("서버에 연결하지 못했습니다: " + err.message);
        }
      }

      document.getElementById("pwInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter") unlock();
      });

      /* ==========================================================
         스타소울 — 시즌 등록 / 주간 보너스 선택
         cozytools-worker 의 /seasons 엔드포인트를 씀 (이벤트 API와 별개).
         ========================================================== */
      const SEASONS_API = API_URL + "/seasons";
      const SEASON_GRADE_COUNTS = { SSR: 2, SR: 5, R: 5 };
      let ALL_SEASONS = [];

      function buildSeasonRows() {
        const grades = [];
        Object.keys(SEASON_GRADE_COUNTS).forEach(function (g) {
          for (let i = 0; i < SEASON_GRADE_COUNTS[g]; i++) grades.push(g);
        });
        const box = document.getElementById("ssSoulRows");
        box.dataset.grades = JSON.stringify(grades);
        box.innerHTML = grades
          .map(function (g, i) {
            return (
              '<div class="soul-row">' +
              '<span class="badge-grade ' +
              g +
              '">' +
              g +
              "</span>" +
              '<input type="text" class="sr-name" id="ssName' +
              i +
              '" placeholder="꽃 이름" />' +
              '<input type="text" class="sr-dorazy" id="ssDorazy' +
              i +
              '" placeholder="dorazyId (선택, 예: F0123)" />' +
              "</div>"
            );
          })
          .join("");
      }

      async function submitSeason() {
        const start = document.getElementById("ssStart").value;
        if (!start) {
          showMsg("ssMsg", "시즌 시작일을 입력해 주세요.", false);
          return;
        }
        if (new Date(start + "T00:00:00").getDay() !== 0) {
          showMsg("ssMsg", "시즌 시작일은 일요일이어야 합니다.", false);
          return;
        }

        const grades = JSON.parse(document.getElementById("ssSoulRows").dataset.grades || "[]");
        const souls = [];
        for (let i = 0; i < grades.length; i++) {
          const name = document.getElementById("ssName" + i).value.trim();
          if (!name) {
            showMsg("ssMsg", "꽃 이름을 12개 모두 입력해 주세요.", false);
            return;
          }
          souls.push({
            name: name,
            grade: grades[i],
            dorazyId: document.getElementById("ssDorazy" + i).value.trim(),
          });
        }

        const btn = document.getElementById("ssSubmitBtn");
        btn.disabled = true;
        btn.textContent = "등록 중...";
        try {
          const res = await fetch(SEASONS_API, {
            method: "POST",
            body: JSON.stringify({ action: "addSeason", pw: pw, start: start, souls: souls }),
          });
          const data = await res.json();
          if (data.ok) {
            showMsg("ssMsg", "시즌을 등록했습니다.", true);
            loadSeasons();
          } else {
            showMsg("ssMsg", data.error || "등록에 실패했습니다.", false);
          }
        } catch (err) {
          showMsg("ssMsg", "서버에 연결하지 못했습니다: " + err.message, false);
        } finally {
          btn.disabled = false;
          btn.textContent = "시즌 등록";
        }
      }

      function currentWeekFor(season) {
        const start = new Date(season.start + "T00:00:00");
        const diffDays = Math.floor((new Date() - start) / 86400000);
        let week = Math.floor(diffDays / 7) + 1;
        if (week < 1) week = 1;
        if (week > 4) week = 4;
        return week;
      }

      function populateSeasonSelect() {
        const sel = document.getElementById("sbSeason");
        sel.innerHTML = ALL_SEASONS.map(function (s, idx) {
          return '<option value="' + idx + '">' + s.start + " 시즌</option>";
        }).join("");
        if (ALL_SEASONS.length) {
          sel.value = String(ALL_SEASONS.length - 1);
          onSeasonChange();
        } else {
          document.getElementById("sbChecklist").innerHTML = '<div class="empty-msg">등록된 시즌이 없습니다.</div>';
          document.getElementById("sbSavedList").innerHTML = "";
        }
      }

      function onSeasonChange() {
        const season = ALL_SEASONS[Number(document.getElementById("sbSeason").value)];
        if (!season) return;
        document.getElementById("sbWeek").value = String(currentWeekFor(season));
        renderBonusChecklist();
        renderSavedBonus(season);
      }

      function renderBonusChecklist() {
        const season = ALL_SEASONS[Number(document.getElementById("sbSeason").value)];
        if (!season) return;
        const week = Number(document.getElementById("sbWeek").value);
        const slot = season.bonus.find(function (b) {
          return b.week === week;
        });
        const already = (slot && slot.souls) || [];
        const box = document.getElementById("sbChecklist");
        box.innerHTML = season.souls
          .map(function (s) {
            const on = already.indexOf(s.name) !== -1;
            return (
              '<label class="grade-item' +
              (on ? " on" : "") +
              '">' +
              '<input type="checkbox" value="' +
              escapeHtml(s.name) +
              '" onchange="toggleBonusItem(this)"' +
              (on ? " checked" : "") +
              " />" +
              '<span class="gname">' +
              escapeHtml(s.name) +
              "</span>" +
              '<span class="gprob">' +
              s.grade +
              "</span>" +
              "</label>"
            );
          })
          .join("");
      }

      function toggleBonusItem(checkbox) {
        checkbox.closest(".grade-item").classList.toggle("on", checkbox.checked);
        const checked = document.querySelectorAll("#sbChecklist input:checked");
        if (checked.length > 3) {
          checkbox.checked = false;
          checkbox.closest(".grade-item").classList.remove("on");
          alert("보너스는 정확히 3종만 선택할 수 있어요.");
        }
      }

      async function submitBonus() {
        const season = ALL_SEASONS[Number(document.getElementById("sbSeason").value)];
        if (!season) {
          showMsg("sbMsg", "시즌을 선택해 주세요.", false);
          return;
        }
        const week = Number(document.getElementById("sbWeek").value);
        const checked = Array.from(document.querySelectorAll("#sbChecklist input:checked")).map(function (el) {
          return el.value;
        });
        if (checked.length !== 3) {
          showMsg("sbMsg", "정확히 3종을 선택해 주세요.", false);
          return;
        }

        try {
          const res = await fetch(SEASONS_API, {
            method: "POST",
            body: JSON.stringify({ action: "setBonus", pw: pw, seasonId: season.id, week: week, souls: checked }),
          });
          const data = await res.json();
          if (data.ok) {
            showMsg("sbMsg", "보너스를 저장했습니다.", true);
            loadSeasons();
          } else {
            showMsg("sbMsg", data.error || "저장에 실패했습니다.", false);
          }
        } catch (err) {
          showMsg("sbMsg", "서버에 연결하지 못했습니다: " + err.message, false);
        }
      }

      function renderSavedBonus(season) {
        if (!season) return;
        const box = document.getElementById("sbSavedList");
        box.innerHTML = season.bonus
          .map(function (b) {
            return (
              '<div class="event-row"><div class="body">' +
              '<div class="emeta">' +
              b.week +
              "주차 (" +
              b.start +
              ")</div>" +
              '<div class="ename">' +
              (b.souls ? b.souls.map(escapeHtml).join(", ") : "미정") +
              "</div>" +
              "</div></div>"
            );
          })
          .join("");
      }

      async function loadSeasons() {
        try {
          const res = await fetch(SEASONS_API);
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "시즌 목록을 불러오지 못했습니다.");
          ALL_SEASONS = data.seasons || [];
          populateSeasonSelect();
        } catch (err) {
          document.getElementById("sbChecklist").innerHTML = '<div class="msg err">불러오기 실패: ' + err.message + "</div>";
        }
      }

      buildSeasonRows();
    </script>
  </body>
</html>
